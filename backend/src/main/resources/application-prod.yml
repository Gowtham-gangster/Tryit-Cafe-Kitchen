server:
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      internal-proxies: 127\\.0\\.0\\.1|10\\..*|172\\.(1[6-9]|2[0-9]|3[0-1])\\..*|192\\.168\\..*

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    hikari:
      pool-name: TryItCafeHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000          # 5 minutes
      connection-timeout: 20000     # 20 seconds
      max-lifetime: 1200000         # 20 minutes (prevents Supabase pooler abrupt closure)
      keepalive-time: 60000         # 1 minute (keeps TCP connection alive across cloud NAT)
      validation-timeout: 5000      # 5 seconds
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

app:
  frontend-url: ${FRONTEND_URL:https://tryitcafe.com}
  media:
    allow-local-fallback: false
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://tryitcafe.com,https://www.tryitcafe.com}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    sample-data: ${APP_SEED_SAMPLE_DATA:false}
    owner-phone: ${OWNER_INITIAL_PHONE:}
    owner-password: ${OWNER_INITIAL_PASSWORD:}
