server:
  port: ${PORT:${SERVER_PORT:8080}}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
  servlet:
    context-path: /

spring:
  application:
    name: tryit-cafe-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  media:
    allow-local-fallback: ${ALLOW_LOCAL_MEDIA_FALLBACK:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    sample-data: ${APP_SEED_SAMPLE_DATA:false}
    owner-phone: ${OWNER_INITIAL_PHONE:}
    owner-password: ${OWNER_INITIAL_PASSWORD:}
    customer-phone: ${CUSTOMER_INITIAL_PHONE:}
    customer-password: ${CUSTOMER_INITIAL_PASSWORD:}
    whatsapp-number: ${WHATSAPP_NUMBER:}
    phone-number: ${PHONE_NUMBER:}
    support-email: ${SUPPORT_EMAIL:tryit.cafekichen@gmail.com}
